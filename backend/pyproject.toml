[project]
name = "variance-studio"
version = "0.2.0"
description = "A local character-first creative studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlmodel>=0.0.24,<0.1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "pillow>=11.3,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
